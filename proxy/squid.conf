# The sandbox's egress proxy: allowlist, deny by default.
#
# The agent container is attached only to oab-int (--internal, no route out), so
# this is its single way out. This host sits on both oab-int and oab-ext, which
# makes it the one and only gate.

http_port 3128

# --- Permitted destinations ---
#
# googleapis.com  : Vertex AI (pi's model requests) plus the oauth2 token exchange
# discord.com     : Discord's REST API and gateway
# discordapp.net  : Discord's CDN (attachments, avatars)
#
# This list can only ever be the union of what openab needs and what pi needs.
# They share one network namespace -- pi is openab's stdio child -- so there is no
# kernel-level way to govern them separately.
#
# r.jina.ai is deliberately absent here. AGENTS.md relies on it to fetch problem
# statements, which means this rule breaks that feature -- and forcing that
# decision into the open is exactly what this stage is for.
acl allowed_domains dstdomain .googleapis.com .discord.com .discordapp.net .discordapp.com

# --- The explicit exception: fetching problem statements ---
#
# AGENTS.md uses r.jina.ai to turn NeetCode pages into markdown. This is the only
# place in the whole system where an external web page enters the context, which
# makes it the only prompt-injection entry point.
#
# Decision (2026-08-20): allow it, but at the narrowest possible scope, and with
# every call landing in access.log -- a capability the host-mode setup does not
# have at all.
#
# Written as `r.jina.ai` rather than `.jina.ai` on purpose: this opens exactly one
# hostname, not every other service under that domain.
acl jina dstdomain r.jina.ai

# --- Sources: Docker's private ranges ---
acl localnet src 172.16.0.0/12
acl localnet src 192.168.0.0/16

# --- Ports ---
acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443
acl CONNECT method CONNECT

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports

# Allowlist discipline: permit the listed traffic first, deny all last. The
# order cannot be reversed.
http_access allow localnet allowed_domains
http_access allow localnet jina
http_access deny all

# --- Limits applied to r.jina.ai ---
#
# First, what squid genuinely cannot do here. HTTPS travels through a CONNECT
# tunnel, so squid sees only the destination hostname -- not the HTTP method, and
# not the size of the reply body. `reply_body_max_size` and "GET only" therefore
# have no effect on this path. Making either work would require SSL-bump: a
# self-signed CA intercepting and decrypting TLS, which means putting a CA private
# key inside the container and creating a fresh attack surface. Not done.
#
# Bandwidth is the only thing a tunnel can actually be held to. delay_pools gives
# r.jina.ai its own bucket: 512KB burst, then 64KB/s. That constrains bulk
# exfiltration, *not* injection -- a hundred bytes of injected text passes through
# just fine.
#
# What actually works against injection is still the `sed '/^Topics$/,$d'` in
# AGENTS.md, which keeps the content out of the context in the first place. That
# is the context layer, not the network layer.
delay_pools 1
delay_class 1 2
delay_parameters 1 -1/-1 65536/524288
delay_access 1 allow jina
delay_access 1 deny all

# --- Do not leak anything about the proxy itself upstream ---
via off
forwarded_for delete
httpd_suppress_version_string on

# --- No caching. The sandbox wants an observable gate, not an accelerator ---
cache deny all

# --- Logging ---
#
# Do not redirect this to /dev/stdout. squid drops privileges to the `proxy` user,
# those device nodes belong to root, and the result is
# FATAL: Cannot open '/dev/stdout' for writing -- it simply will not start. Keep
# the default file path and read the log with:
#   docker exec oab-proxy tail -f /var/log/squid/access.log
access_log /var/log/squid/access.log squid
