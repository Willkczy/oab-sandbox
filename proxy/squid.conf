# 沙箱出口 proxy —— 允許清單制，預設拒絕。
#
# agent 容器只接 oab-int（--internal，沒有對外路由），唯一的出口就是這裡。
# 這台同時接 oab-int 與 oab-ext，等於是唯一一道閘門。

http_port 3128

# --- 允許的目的地 ---
#
# googleapis.com  : Vertex AI（pi 的模型請求）+ oauth2 換 token
# discord.com     : Discord REST API 與 gateway
# discordapp.net  : Discord 的 CDN（附件、頭像）
#
# ⚠️ 清單只能是「openab 要打的」與「pi 要打的」聯集 —— 兩者共用同一個
# network namespace（pi 是 openab 的 stdio 子行程），沒有辦法用核心手段分開治理。
#
# ⚠️ r.jina.ai 刻意不在清單裡。AGENTS.md 靠它抓題目敘述，也就是說
# 這條規則會擋掉那個功能 —— 那正是這一階要逼出來的決定。
acl allowed_domains dstdomain .googleapis.com .discord.com .discordapp.net .discordapp.com

# --- 明示的例外：抓題目敘述 ---
#
# AGENTS.md 用 r.jina.ai 把 NeetCode 頁面轉成 markdown，這是整套系統唯一
# 把「外部網頁」拉進 context 的地方，也就是唯一的 prompt injection 入口。
#
# 決定（2026-08-20）：放行，但範圍收到最小，而且每一次呼叫都會留在
# access.log 裡——那是主機模式完全沒有的能力。
#
# ⚠️ 刻意寫 `r.jina.ai` 而不是 `.jina.ai`：只開這一個主機名，
#    不連帶開整個網域底下的其他服務。
acl jina dstdomain r.jina.ai

# --- 來源：Docker 的私有網段 ---
acl localnet src 172.16.0.0/12
acl localnet src 192.168.0.0/16

# --- 埠 ---
acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443
acl CONNECT method CONNECT

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports

# 允許清單制：先放行白名單，最後 deny all。順序不能顛倒。
http_access allow localnet allowed_domains
http_access allow localnet jina
http_access deny all

# --- r.jina.ai 的限制 ---
#
# ⚠️ 先說清楚 squid 在這裡「做不到」什麼：
#   HTTPS 走的是 CONNECT 隧道，squid 只看得到目的主機名，
#   **看不到 HTTP method，也看不到 reply body 大小**。
#   所以 `reply_body_max_size` 與「只允許 GET」對這條路徑無效——
#   那兩件事要成立，得做 SSL-bump（自簽 CA 攔 TLS 解密），
#   代價是容器裡要放一把 CA 私鑰，本身又是新的攻擊面。尚未做。
#
# 隧道裡真的擋得住的只有頻寬。delay_pools 給 r.jina.ai 一個獨立的水桶：
# 突發上限 512KB，之後降到 64KB/s。這擋的是「大量搬運」，
# **不是** injection —— 一百個位元組的注入照樣過得去。
#
# 真正對 injection 有效的仍然是 AGENTS.md 裡那個
# `sed '/^Topics$/,$d'`（讓內容根本不進 context），那是 context 層，不是網路層。
delay_pools 1
delay_class 1 2
delay_parameters 1 -1/-1 65536/524288
delay_access 1 allow jina
delay_access 1 deny all

# --- 不要洩漏 proxy 自身資訊給上游 ---
via off
forwarded_for delete
httpd_suppress_version_string on

# --- 不快取。沙箱要的是可觀測的閘門，不是加速器 ---
cache deny all

# --- log ---
#
# 不要導去 /dev/stdout：squid 降權跑在 `proxy` 使用者下，那兩個裝置節點是
# root 的，會 FATAL: Cannot open '/dev/stdout' for writing 直接開不起來。
# 用預設的檔案路徑，看 log 走：
#   docker exec oab-proxy tail -f /var/log/squid/access.log
access_log /var/log/squid/access.log squid
